name: College basketball model bake-off
on:
  schedule:
    # Tuesdays 17:00 UTC, after the NBA retrain. Re-runs the whole bake-off on the latest seasons.
    - cron: '0 17 * 11,12,1,2,3,4 2'
  # Run by hand to start the season. It brings the finals up to date, back-fills ESPN's line on
  # every past game it has not asked about yet (the scoreboard drops odds once a game is final),
  # then runs the bake-off. If the line back-fill runs out of budget, the next run carries on.
  workflow_dispatch:
permissions:
  contents: write
concurrency: {group: ncaab-data, cancel-in-progress: false}
jobs:
  train:
    runs-on: ubuntu-latest
    # Up to DEGEN_NCAAB_LINES_BUDGET (80) minutes of line back-fill, then nine candidates x four
    # jobs x five walk-forward seasons on ~38,000 games (a few minutes).
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12', cache: pip}
      - run: pip install -r requirements.txt
      - name: Back-fill past lines from ESPN
        env:
          DEGEN_NCAAB_LINES_BUDGET: ${{ vars.DEGEN_NCAAB_LINES_BUDGET }}
          DEGEN_NCAAB_LINES_WORKERS: ${{ vars.DEGEN_NCAAB_LINES_WORKERS }}
          DEGEN_NCAAB_LINES_SOURCE: ${{ vars.DEGEN_NCAAB_LINES_SOURCE }}
          DEGEN_NCAAB_FIRST_SEASON: ${{ vars.DEGEN_NCAAB_FIRST_SEASON }}
        run: python -m ncaab.sources.lines
      - env:
          DEGEN_NCAAB_SELECT: ${{ vars.DEGEN_NCAAB_SELECT }}
          DEGEN_NCAAB_SKIP_MODELS: ${{ vars.DEGEN_NCAAB_SKIP_MODELS }}
          DEGEN_NCAAB_WALK_SEASONS: ${{ vars.DEGEN_NCAAB_WALK_SEASONS }}
          DEGEN_NCAAB_FIRST_SEASON: ${{ vars.DEGEN_NCAAB_FIRST_SEASON }}
        run: |
          python -m ncaab.train
          # the leaderboard is on the board, so rebuild it with the new one
          python -m ncaab.site
          python -m core.landing
      - name: Leaderboard in the run summary
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          import pandas as pd
          m = json.load(open("data/ncaab/models/meta.json"))
          print(f"## College basketball bake-off ({m['trained_at'][:10]}, rule: {m['select_rule']})\n")
          try:
              L = pd.read_csv("data/ncaab/lines.csv")
              by = L.assign(ok=L["status"] == "ok").groupby("season")["ok"].agg(["sum", "size"])
              print("**Past lines on file** (with a line / asked): " + ", ".join(
                  f"{int(s)}-{(int(s) + 1) % 100:02d}: {int(r['sum']):,}/{int(r['size']):,}"
                  for s, r in by.iterrows()) + "\n")
          except (OSError, KeyError, ValueError):
              print("**Past lines on file:** none yet\n")
          for job, r in m["jobs"].items():
              if r.get("skipped"):
                  print(f"**{job}**: skipped - {r.get('reason')}\n"); continue
              print(f"**{job}** - running **{r['chosen']}** (lowest error: {r['best']}), seasons {r['test_seasons']}\n")
              print("| model | MAE | side hit % | vs best (z) |\n|---|---:|---:|---:|")
              for row in r["leaderboard"]:
                  print(f"| {row['model']} | {row['mae']:.3f} | {row.get('hit_rate') or '-'} | {row.get('z', '-')} |")
              print()
          PY
      # always(): a back-fill that ran for an hour is kept even if the bake-off after it fails
      - if: always()
        run: |
          git config user.name  "degenbot"
          git config user.email "actions@github.com"
          git add data docs
          if git diff --staged --quiet; then
            echo "nothing to commit"
            exit 0
          fi
          git commit -m "ncaab bake-off $(date -u +%Y-%m-%d)"
          git pull --rebase origin main
          git push origin HEAD:main
