name: EPL source check
# Manual and read-only. Never commits.
#
# Reports what the ACTIVE source resolves - whichever backend DEGEN_EPL_SOURCE selects - into
# the job summary, which the GitHub mobile app renders as a page rather than as raw logs.
# It follows the configuration deliberately: a check hardcoded to one backend kept reporting
# 503s from a host the pipeline no longer reads, which looks like a broken pipeline when
# nothing is wrong.
on:
  workflow_dispatch:
    inputs:
      league:
        description: 'League code, e.g. E0 (Premier League), E1 (Championship)'
        required: false
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    # A hung upstream must never burn Actions minutes for hours; the
    # circuit breaker in sources/footballdata.py should make this unreachable.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12', cache: pip}
      - run: pip install -r requirements.txt
      - run: |
          python -m epl.sources.check \
            ${{ inputs.league && format('--league {0}', inputs.league) || '' }}
