name: CFB grade
on:
  schedule:
    - cron: '0 11 * * *'      # 11:00 UTC = 7am ET, after late West-coast finals
  workflow_dispatch:
permissions:
  contents: write
concurrency: {group: cfb-data, cancel-in-progress: false}
jobs:
  grade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12', cache: pip}
      - run: pip install -r requirements.txt
      - env:
          CFBD_API_KEY: ${{ secrets.CFBD_API_KEY }}
        run: |
          python -m cfb.grade
          python -m cfb.site
      - run: |
          git config user.name  "degenbot"
          git config user.email "actions@github.com"
          git pull --rebase --autostash || true
          git add data docs
          git diff --staged --quiet || git commit -m "cfb grade $(date -u +%Y-%m-%d)"
          git push
