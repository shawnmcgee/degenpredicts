name: NHL retrain
on:
  schedule:
    # Tuesdays 15:00 UTC, staggered away from the other sports' Tuesday retrains.
    - cron: '0 15 * * 2'
  workflow_dispatch:
permissions:
  contents: write
concurrency: {group: nhl-data, cancel-in-progress: false}
jobs:
  train:
    runs-on: ubuntu-latest
    # Refreshing the NHL API is a handful of requests; fitting the late-game scoreline model by
    # maximum likelihood is most of the run, a couple of minutes.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12', cache: pip}
      - run: pip install -r requirements.txt
      # No key needed. The run refreshes the last three seasons from the NHL Stats API (the next
      # season's schedule included), promotes finished games' pre-game snapshots into lines.csv,
      # then refits everything. The historical lines are committed and never refetched here.
      - run: python -m nhl.train
      - run: |
          git config user.name  "degenbot"
          git config user.email "actions@github.com"
          # Stage and commit BEFORE pulling. Pulling first is what broke the first EPL picks
          # run: `python -m <sport>.site` writes docs/<sport>/index.html as an UNTRACKED file,
          # and if the remote has gained a commit that also creates it, git refuses to clobber
          # it and aborts the pull. The old `|| true` then swallowed that abort, the commit
          # landed on a stale base, and the push was rejected non-fast-forward. Committing
          # first leaves nothing untracked for the rebase to collide with.
          git add data
          if git diff --staged --quiet; then
            echo "nothing to commit"
            exit 0
          fi
          git commit -m "nhl retrain $(date -u +%Y-%m-%d)"
          # No `|| true`: after committing, a failed rebase is a real conflict worth failing on
          # rather than something to hide behind a push that cannot succeed.
          git pull --rebase origin main
          git push origin HEAD:main
