name: CFB retrain
on:
  schedule:
    - cron: '0 12 * * 2'      # Tuesdays 12:00 UTC, after the week is complete
  workflow_dispatch:
    inputs:
      search: {description: 'Hyper-parameter search', type: boolean, default: false}
permissions:
  contents: write
concurrency: {group: cfb-data, cancel-in-progress: false}
jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12', cache: pip}
      - run: pip install -r requirements.txt
      - env:
          CFBD_API_KEY: ${{ secrets.CFBD_API_KEY }}
        run: python -m cfb.train ${{ inputs.search && '--search' || '' }}
      - run: |
          git config user.name  "degenbot"
          git config user.email "actions@github.com"
          git pull --rebase --autostash || true
          git add data
          git diff --staged --quiet || git commit -m "cfb retrain $(date -u +%Y-%m-%d)"
          git push
