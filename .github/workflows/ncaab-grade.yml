name: College basketball grade
on:
  schedule:
    # 12:45 UTC = 7:45am ET: after the West-coast finals, and after the NBA grade so the two never
    # race for the same commit.
    - cron: '45 12 * 11,12,1,2,3,4 *'
  workflow_dispatch:
permissions:
  contents: write
concurrency: {group: ncaab-data, cancel-in-progress: false}
jobs:
  grade:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12', cache: pip}
      - run: pip install -r requirements.txt
      - run: |
          python -m ncaab.grade
          python -m ncaab.site
          # the front page is a chooser over whatever each sport has published
          python -m core.landing
      - run: |
          git config user.name  "degenbot"
          git config user.email "actions@github.com"
          git add data docs
          if git diff --staged --quiet; then
            echo "nothing to commit"
            exit 0
          fi
          git commit -m "ncaab grade $(date -u +%Y-%m-%d)"
          git pull --rebase origin main
          git push origin HEAD:main
