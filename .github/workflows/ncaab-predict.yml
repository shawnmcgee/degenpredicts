name: College basketball picks
on:
  schedule:
    # 15:45 UTC = 10:45am ET in season: the morning board, after the NBA's morning run so the two
    # never rebuild the shared front page at once. Its numbers are the first_seen_* CLV is
    # measured from.
    - cron: '45 15 * 11,12,1,2,3,4 *'
    # 21:30 UTC = 4:30pm ET: fresh prices before the 6:30-7pm tips. Games already under way are
    # never re-priced, so noon tips keep their morning number.
    - cron: '30 21 * 11,12,1,2,3,4 *'
  workflow_dispatch:
    inputs:
      days:
        description: 'Days ahead to post besides today (blank = 1)'
        required: false
permissions:
  contents: write
concurrency: {group: ncaab-data, cancel-in-progress: false}
jobs:
  predict:
    runs-on: ubuntu-latest
    # Refits the bake-off's chosen models on every D1 game through last night - about a minute.
    # The very first run, if it beats the training job to it, also back-fills ESPN (~15 min).
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12', cache: pip}
      - run: pip install -r requirements.txt
      # No key needed: ESPN's scoreboard gives the finals, the slate and its partner book's lines.
      - env:
          DEGEN_NCAAB_BOARD_DAYS: ${{ inputs.days || vars.DEGEN_NCAAB_BOARD_DAYS }}
          DEGEN_NCAAB_MIN_GAMES: ${{ vars.DEGEN_NCAAB_MIN_GAMES }}
        run: |
          python -m ncaab.predict
          python -m ncaab.site
          # the front page is a chooser over whatever each sport has published
          python -m core.landing
      - run: |
          git config user.name  "degenbot"
          git config user.email "actions@github.com"
          # Stage and commit BEFORE pulling - see nba-predict.yml for the run that taught this.
          git add data docs
          if git diff --staged --quiet; then
            echo "nothing to commit"
            exit 0
          fi
          git commit -m "ncaab picks $(date -u +%Y-%m-%d)"
          git pull --rebase origin main
          git push origin HEAD:main
