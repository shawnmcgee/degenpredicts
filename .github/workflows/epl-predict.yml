name: EPL picks
on:
  schedule:
    # 08:00 UTC. After the two American jobs, so no two sports race for the same commit.
    - cron: '0 8 * * *'
  workflow_dispatch:
    inputs:
      days:
        description: 'How many days ahead to post (blank = default)'
        required: false
permissions:
  contents: write
concurrency: {group: epl-data, cancel-in-progress: false}
jobs:
  predict:
    runs-on: ubuntu-latest
    # A hung upstream must never burn Actions minutes for hours; the
    # circuit breaker in sources/footballdata.py should make this unreachable.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12', cache: pip}
      - run: pip install -r requirements.txt
      # ODDS_API_KEY is optional: without it the pipeline uses football-data's own prices
      # rather than a live number from a book you can bet this morning.
      - env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          DEGEN_EPL_LEAGUE: ${{ vars.DEGEN_EPL_LEAGUE }}
          DEGEN_SUP_EDGE: ${{ vars.DEGEN_SUP_EDGE }}
          DEGEN_GOALS_EDGE: ${{ vars.DEGEN_GOALS_EDGE }}
          DEGEN_KELLY: ${{ vars.DEGEN_KELLY }}
        run: |
          python -m epl.predict ${{ inputs.days && format('--days {0}', inputs.days) || '' }}
          python -m epl.site
          # the front page is a chooser over whatever each sport has published
          python -m core.landing
      - run: |
          git config user.name  "degenbot"
          git config user.email "actions@github.com"
          # Stage and commit BEFORE pulling. Pulling first is what broke this job: `python -m <sport>.site`
          # writes docs/<sport>/index.html as an UNTRACKED file, and if the remote has gained a
          # commit that also creates it, git refuses to clobber it and aborts the pull. The old
          # `|| true` then swallowed that abort, the commit landed on a stale base, and the push
          # was rejected non-fast-forward. Committing first means there are no untracked files
          # left for the rebase to collide with, so it replays cleanly onto whatever arrived.
          git add data docs
          if git diff --staged --quiet; then
            echo "nothing to commit"
            exit 0
          fi
          git commit -m "epl picks $(date -u +%Y-%m-%d)"
          # No `|| true` here: after committing, a failed rebase is a real conflict worth
          # failing on, rather than something to hide behind a push that cannot succeed.
          git pull --rebase origin main
          git push origin HEAD:main
