name: NBA picks
on:
  schedule:
    # 15:00 UTC = 11am ET (10am in winter): the morning board. Its numbers are the ones CLV is
    # measured FROM - first_* survives every later rewrite of a game's row. Staggered 45 minutes
    # after the NHL's morning run, because both rebuild the shared front page.
    - cron: '0 15 * * *'
    # 22:15 UTC = 5:15pm ET for most of the season (6:15pm in October and from mid-March): after
    # the afternoon injury updates, before the 7pm tips. Its snapshot is the closing line CLV is
    # measured TO, and the picks the morning had to leave waiting on injury news stake here.
    - cron: '15 22 * * *'
  workflow_dispatch:
    inputs:
      days:
        description: 'How many days ahead to post (blank = default)'
        required: false
permissions:
  contents: write
concurrency: {group: nba-data, cancel-in-progress: false}
jobs:
  predict:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12', cache: pip}
      - run: pip install -r requirements.txt
      # No key needed: hoopR's release files and ESPN's scoreboard and injury report are public.
      # Prices come from ESPN's partner book unless DEGEN_NBA_ODDS is set to "oddsapi" - which
      # spends 3 credits a run from the key the other four boards share, so it is opt-in.
      - env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          DEGEN_NBA_ODDS: ${{ vars.DEGEN_NBA_ODDS }}
          DEGEN_NBA_SPREAD_EDGE: ${{ vars.DEGEN_NBA_SPREAD_EDGE }}
          DEGEN_NBA_TOTAL_EDGE: ${{ vars.DEGEN_NBA_TOTAL_EDGE }}
          DEGEN_NBA_ML_EV: ${{ vars.DEGEN_NBA_ML_EV }}
          DEGEN_NBA_WAIT_POINTS: ${{ vars.DEGEN_NBA_WAIT_POINTS }}
          DEGEN_KELLY: ${{ vars.DEGEN_KELLY }}
        run: |
          python -m nba.predict ${{ inputs.days && format('--days {0}', inputs.days) || '' }}
          python -m nba.site
          # the front page is a chooser over whatever each sport has published
          python -m core.landing
      - run: |
          git config user.name  "degenbot"
          git config user.email "actions@github.com"
          # Stage and commit BEFORE pulling. Pulling first is what broke the first EPL picks
          # run: `python -m <sport>.site` writes docs/<sport>/index.html as an UNTRACKED file,
          # and if the remote has gained a commit that also creates it, git refuses to clobber
          # it and aborts the pull. The old `|| true` then swallowed that abort, the commit
          # landed on a stale base, and the push was rejected non-fast-forward. Committing
          # first leaves nothing untracked for the rebase to collide with.
          git add data docs
          if git diff --staged --quiet; then
            echo "nothing to commit"
            exit 0
          fi
          git commit -m "nba picks $(date -u +%Y-%m-%d)"
          # No `|| true`: after committing, a failed rebase is a real conflict worth failing on
          # rather than something to hide behind a push that cannot succeed.
          git pull --rebase origin main
          git push origin HEAD:main
