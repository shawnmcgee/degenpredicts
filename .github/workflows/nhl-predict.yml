name: NHL picks
on:
  schedule:
    # 14:15 UTC = 10:15am ET (9:15 in winter): the morning board. Its numbers are the ones CLV
    # is measured FROM - first_seen_* survives every later rewrite of a game's row.
    - cron: '15 14 * * *'
    # 21:45 UTC = 5:45pm ET (4:45 in winter): an hour or two before the 7pm puck drops, when the
    # prices know the starting goalies. Its snapshot is the closing line CLV is measured TO.
    - cron: '45 21 * * *'
  workflow_dispatch:
    inputs:
      days:
        description: 'How many days ahead to post (blank = default)'
        required: false
permissions:
  contents: write
concurrency: {group: nhl-data, cancel-in-progress: false}
jobs:
  predict:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12', cache: pip}
      - run: pip install -r requirements.txt
      # The NHL's APIs need no key. ODDS_API_KEY is what makes anything stakeable: without it the
      # board still predicts every game, but there is no price to measure EV against. Each run
      # costs 3 Odds API credits (three markets, one region), so two runs a day is ~180 a month.
      - env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          DEGEN_NHL_SPREAD_EV: ${{ vars.DEGEN_NHL_SPREAD_EV }}
          DEGEN_NHL_TOTAL_EV: ${{ vars.DEGEN_NHL_TOTAL_EV }}
          DEGEN_KELLY: ${{ vars.DEGEN_KELLY }}
        run: |
          python -m nhl.predict ${{ inputs.days && format('--days {0}', inputs.days) || '' }}
          python -m nhl.site
          # the front page is a chooser over whatever each sport has published
          python -m core.landing
      - run: |
          git config user.name  "degenbot"
          git config user.email "actions@github.com"
          # Stage and commit BEFORE pulling. Pulling first is what broke the first EPL picks
          # run: `python -m <sport>.site` writes docs/<sport>/index.html as an UNTRACKED file,
          # and if the remote has gained a commit that also creates it, git refuses to clobber
          # it and aborts the pull. The old `|| true` then swallowed that abort, the commit
          # landed on a stale base, and the push was rejected non-fast-forward. Committing
          # first leaves nothing untracked for the rebase to collide with.
          git add data docs
          if git diff --staged --quiet; then
            echo "nothing to commit"
            exit 0
          fi
          git commit -m "nhl picks $(date -u +%Y-%m-%d)"
          # No `|| true`: after committing, a failed rebase is a real conflict worth failing on
          # rather than something to hide behind a push that cannot succeed.
          git pull --rebase origin main
          git push origin HEAD:main
