name: NFL retrain
on:
  schedule:
    # Tuesdays 12:30 UTC, after Monday Night Football completes the week.
    - cron: '30 12 * * 2'
  workflow_dispatch:
    inputs:
      search: {description: 'Hyper-parameter search', type: boolean, default: false}
permissions:
  contents: write
concurrency: {group: nfl-data, cancel-in-progress: false}
jobs:
  train:
    runs-on: ubuntu-latest
    # The first run backfills snap counts and rosters for every season in the window
    # (~60MB) to build the roster-continuity table. Later runs refresh two seasons.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12', cache: pip}
      - run: pip install -r requirements.txt
      - run: python -m nfl.train ${{ inputs.search && '--search' || '' }}
      - run: |
          git config user.name  "degenbot"
          git config user.email "actions@github.com"
          git pull --rebase --autostash || true
          git add data
          git diff --staged --quiet || git commit -m "nfl retrain $(date -u +%Y-%m-%d)"
          git push
