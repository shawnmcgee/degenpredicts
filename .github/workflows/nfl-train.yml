name: NFL retrain
on:
  schedule:
    # Tuesdays 12:30 UTC, after Monday Night Football completes the week.
    - cron: '30 12 * * 2'
  workflow_dispatch:
    inputs:
      search: {description: 'Hyper-parameter search', type: boolean, default: false}
permissions:
  contents: write
concurrency: {group: nfl-data, cancel-in-progress: false}
jobs:
  train:
    runs-on: ubuntu-latest
    # The first run backfills snap counts and rosters for every season in the window
    # (~60MB) to build the roster-continuity table. Later runs refresh two seasons.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12', cache: pip}
      - run: pip install -r requirements.txt
      - run: python -m nfl.train ${{ inputs.search && '--search' || '' }}
      - run: |
          git config user.name  "degenbot"
          git config user.email "actions@github.com"
          # Stage and commit BEFORE pulling. Pulling first is what broke the first EPL picks
          # run: `python -m <sport>.site` writes docs/<sport>/index.html as an UNTRACKED file,
          # and if the remote has gained a commit that also creates it, git refuses to clobber
          # it and aborts the pull. The old `|| true` then swallowed that abort, the commit
          # landed on a stale base, and the push was rejected non-fast-forward. Committing
          # first leaves nothing untracked for the rebase to collide with.
          git add data
          if git diff --staged --quiet; then
            echo "nothing to commit"
            exit 0
          fi
          git commit -m "nfl retrain $(date -u +%Y-%m-%d)"
          # No `|| true`: after committing, a failed rebase is a real conflict worth failing on
          # rather than something to hide behind a push that cannot succeed.
          git pull --rebase origin main
          git push origin HEAD:main
