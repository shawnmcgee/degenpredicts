name: EPL grade
on:
  schedule:
    # 06:30 UTC, before the picks job, so the board is built on freshly graded results.
    - cron: '30 6 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency: {group: epl-data, cancel-in-progress: false}
jobs:
  grade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12', cache: pip}
      - run: pip install -r requirements.txt
      - env:
          DEGEN_EPL_LEAGUE: ${{ vars.DEGEN_EPL_LEAGUE }}
        run: |
          python -m epl.grade
          python -m epl.site
          python -m core.landing
      - run: |
          git config user.name  "degenbot"
          git config user.email "actions@github.com"
          git pull --rebase --autostash || true
          git add data docs
          git diff --staged --quiet || git commit -m "epl grade $(date -u +%Y-%m-%d)"
          git push
