name: CFB picks
on:
  schedule:
    - cron: '0 13 * * *'      # 13:00 UTC = 9am ET, daily during the season
  workflow_dispatch:
    inputs:
      week:
        description: 'Force a specific week (blank = auto)'
        required: false
permissions:
  contents: write
concurrency: {group: cfb-data, cancel-in-progress: false}
jobs:
  predict:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12', cache: pip}
      - run: pip install -r requirements.txt
      - env:
          CFBD_API_KEY: ${{ secrets.CFBD_API_KEY }}
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: |
          python -m cfb.predict ${{ inputs.week && format('--week {0}', inputs.week) || '' }}
          python -m cfb.site
          # the front page is a chooser over whatever each sport has published
          python -m core.landing
      - run: |
          git config user.name  "degenbot"
          git config user.email "actions@github.com"
          # Stage and commit BEFORE pulling. Pulling first is what broke the first EPL picks
          # run: `python -m <sport>.site` writes docs/<sport>/index.html as an UNTRACKED file,
          # and if the remote has gained a commit that also creates it, git refuses to clobber
          # it and aborts the pull. The old `|| true` then swallowed that abort, the commit
          # landed on a stale base, and the push was rejected non-fast-forward. Committing
          # first leaves nothing untracked for the rebase to collide with.
          git add data docs
          if git diff --staged --quiet; then
            echo "nothing to commit"
            exit 0
          fi
          git commit -m "cfb picks $(date -u +%Y-%m-%d)"
          # No `|| true`: after committing, a failed rebase is a real conflict worth failing on
          # rather than something to hide behind a push that cannot succeed.
          git pull --rebase origin main
          git push origin HEAD:main
