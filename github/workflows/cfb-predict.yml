name: CFB picks
on:
  schedule:
    - cron: '0 13 * * *'      # 13:00 UTC = 9am ET, daily during the season
  workflow_dispatch:
    inputs:
      week:
        description: 'Force a specific week (blank = auto)'
        required: false
permissions:
  contents: write
concurrency: {group: cfb-data, cancel-in-progress: false}
jobs:
  predict:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12', cache: pip}
      - run: pip install -r requirements.txt
      - env:
          CFBD_API_KEY: ${{ secrets.CFBD_API_KEY }}
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: |
          python -m cfb.predict ${{ inputs.week && format('--week {0}', inputs.week) || '' }}
          python -m cfb.site
      - run: |
          git config user.name  "degenbot"
          git config user.email "actions@github.com"
          git pull --rebase --autostash || true
          git add data docs
          git diff --staged --quiet || git commit -m "cfb picks $(date -u +%Y-%m-%d)"
          git push
